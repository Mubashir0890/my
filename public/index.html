<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Futbol</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#0b1a2b;--panel:#12263b;--chalk:#f2f5ef;--sig:#ff7a1a;--mute:#8aa0b5;--gold:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.screen{display:none;position:absolute;inset:0;padding:16px;overflow-y:auto}
.screen.on{display:block}
h1{font-size:34px;margin:0 0 4px;letter-spacing:-.5px;font-weight:900}
h2{font-size:22px;margin:16px 0 8px}
.bal{display:flex;gap:10px;margin:8px 0 18px;color:var(--gold);font-weight:700}
button{background:var(--sig);color:#1a0d00;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}
button.ghost{background:var(--panel);color:var(--chalk);border:1px solid #27425f}
button:disabled{opacity:.4}
.menu{display:grid;gap:10px;max-width:420px}
.menu button{text-align:left;font-size:18px;padding:18px}
input,select{background:#0e2033;color:var(--chalk);border:1px solid #27425f;border-radius:10px;padding:12px;font-size:16px;width:100%;margin:4px 0}
label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:90px}
.code{font-size:48px;font-weight:900;letter-spacing:8px;color:var(--gold);margin:10px 0}
.pack{background:var(--panel);border-radius:14px;overflow:hidden;margin:10px 0;max-width:480px}
.pack .img{aspect-ratio:16/9;background:linear-gradient(135deg,#1f7a4a,#0b1a2b);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:10px;font-weight:900;font-size:20px;text-shadow:0 2px 6px #000}
.pack .buy{display:flex;gap:8px;padding:10px}.pack .buy button{flex:1}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{width:112px;aspect-ratio:3/4;border-radius:12px;padding:8px;position:relative;color:#111;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:linear-gradient(160deg,#d08a54,#8a5a30)}
.card.s{background:linear-gradient(160deg,#e6eaee,#8d98a3)}.card.g{background:linear-gradient(160deg,#ffe27a,#c8901a)}.card.x{background:linear-gradient(160deg,#9af0ff,#6a4cff);color:#fff}
.card .r{position:absolute;top:6px;left:8px;font-size:24px;font-weight:900;line-height:1}.card .r small{display:block;font-size:11px;font-weight:700}
.card .ph{position:absolute;top:14px;left:18px;right:6px;bottom:48px;background-size:contain;background-repeat:no-repeat;background-position:center}
.card .n{font-weight:800;font-size:13px;text-align:center;position:relative}
.card .st{display:flex;justify-content:space-between;font-size:10px;font-weight:700;position:relative;margin-top:2px}
.back{margin-bottom:10px}
.li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #27425f}.li button{padding:6px 10px;font-size:13px}
#game{padding:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#game.rot{inset:auto;left:100%;top:0;transform-origin:0 0;transform:rotate(90deg)}
#hud{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:22px;font-weight:900;pointer-events:none;text-shadow:0 2px 4px #000}
#stick{position:absolute;left:0;bottom:0;width:45%;height:70%;touch-action:none}
#base,#knob{position:absolute;border-radius:50%;display:none}
#base{width:140px;height:140px;background:#ffffff22;border:2px solid #ffffff55}
#knob{width:60px;height:60px;background:#ffffffaa}
.act{position:absolute;right:14px;bottom:14px;width:210px;height:210px}
.act button{position:absolute;width:84px;height:84px;border-radius:50%;padding:0;font-size:13px;background:#ffffff26;color:#fff;border:2px solid #ffffff77;touch-action:none}
.act button:active{transform:scale(.92);background:#ffffff55}
#bT{left:63px;top:0}#bP{left:0;top:63px}#bS{right:0;top:63px}#bR{left:63px;bottom:0}
#exit{position:absolute;top:6px;right:8px;padding:8px 12px;font-size:13px}
#over{position:absolute;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--chalk);color:#111;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:9}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk input{width:auto;margin:0}
</style>
</head>
<body>
<div id="toast"></div>

<div id="menu" class="screen on">
  <h1>Futbol</h1>
  <div class="bal"><span class="gpv"></span><span class="cov"></span></div>
  <div class="menu">
    <button onclick="show('lobby')">Do'stlar bilan o'ynash</button>
    <button onclick="socket.emit('ai:start')">Kompyuter bilan o'ynash</button>
    <button onclick="show('shop')">Do'kon va packlar</button>
    <button onclick="show('squad')">Mening o'yinchilarim</button>
    <button id="adminBtn" class="ghost" onclick="show('admin')" style="display:none">Admin panel</button>
  </div>
</div>

<div id="lobby" class="screen">
  <button class="ghost back" onclick="leaveRoom()">Orqaga</button>
  <h1>Do'stlar bilan o'ynash</h1>
  <div class="menu">
    <button onclick="createRoom()">Lobbi xona ochish</button>
    <div id="room" style="display:none">
      <div class="code" id="codeBox"></div>
      <div class="row"><button class="ghost" onclick="copyCode()">Nusxalash</button><button onclick="shareCode()">Do'stga yuborish</button></div>
      <p id="roomInfo" style="color:var(--mute)"></p>
      <button id="startRoom" disabled onclick="socket.emit('lobby:start')">Boshlash</button>
    </div>
    <h2>Lobbi xonaga kirish</h2>
    <input id="joinCode" maxlength="5" placeholder="5 belgili kod" style="text-transform:uppercase;letter-spacing:4px">
    <button onclick="joinRoom($('joinCode').value)">Kirish</button>
    <p style="color:var(--mute)">Do'st bilan har bir o'yin uchun 200 GP (kuniga 10 ta o'yin).</p>
  </div>
</div>

<div id="shop" class="screen">
  <button class="ghost back" onclick="show('menu')">Orqaga</button>
  <h1>Do'kon</h1>
  <div class="bal"><span class="gpv"></span><span class="cov"></span></div>
  <div id="packs"></div>
  <div id="opened"></div>
</div>

<div id="squad" class="screen">
  <button class="ghost back" onclick="show('menu')">Orqaga</button>
  <h1>Mening o'yinchilarim</h1>
  <div class="cards" id="owned"></div>
</div>

<div id="admin" class="screen">
  <button class="ghost back" onclick="show('menu')">Orqaga</button>
  <h1>Admin panel</h1>
  <p style="color:var(--mute)">Adminda GP va Coins cheksiz.</p>

  <h2>Yangi o'yinchi</h2>
  <label>Ism</label><input id="pName">
  <div class="row">
    <div><label>Pozitsiya</label><select id="pPos"><option>FW</option><option>MF</option><option>DF</option><option>GK</option></select></div>
    <div><label>Tezlik</label><input id="pSpd" type="number" min="1" max="99" value="70"></div>
    <div><label>Zarba</label><input id="pSht" type="number" min="1" max="99" value="70"></div>
    <div><label>Pas</label><input id="pPas" type="number" min="1" max="99" value="70"></div>
    <div><label>Himoya</label><input id="pDef" type="number" min="1" max="99" value="50"></div>
  </div>
  <label>Rasm (PNG, JPG)</label><input id="pImg" type="file" accept="image/*">
  <button onclick="addPlayer()" style="margin-top:8px">Saqlash</button>
  <div id="pList"></div>

  <h2>Pack yaratish</h2>
  <label>Pack nomi</label><input id="kName">
  <label>Pack rasmi (16:9)</label><input id="kImg" type="file" accept="image/*">
  <div class="row">
    <div><label>Narx (GP)</label><input id="kGp" type="number" value="2000"></div>
    <div><label>Narx (Coins)</label><input id="kCo" type="number" value="100"></div>
    <div><label>Nechta o'yinchi</label><input id="kCnt" type="number" min="1" value="1"></div>
  </div>
  <label>Pack ichidagi o'yinchilar</label>
  <div id="kPool"></div>
  <button onclick="addPack()" style="margin-top:8px">Pack yaratish</button>
  <div id="kList"></div>

  <h2>Foydalanuvchiga berish</h2>
  <label>Foydalanuvchi ID (bo'sh bo'lsa, o'zingizga)</label><input id="gUid" inputmode="numeric">
  <div class="row">
    <div><label>GP</label><input id="gGp" type="number" value="0"></div>
    <div><label>Coins</label><input id="gCo" type="number" value="0"></div>
  </div>
  <label>O'yinchi</label><select id="gPl"></select>
  <button onclick="giveUser()" style="margin-top:8px">Berish</button>
</div>

<div id="game" class="screen">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <button id="exit" class="ghost" onclick="exitGame()">Chiqish</button>
  <div id="stick"><div id="base"></div><div id="knob"></div></div>
  <div class="act">
    <button id="bT">Through</button><button id="bP">Pass</button>
    <button id="bS">Shoot</button><button id="bR">Yugurish</button>
  </div>
  <div id="over"><h1 id="ovT"></h1><div id="ovS" style="font-size:22px"></div><button onclick="show('menu')">Menyuga qaytish</button></div>
</div>

<script>
const $=i=>document.getElementById(i);
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.lockOrientation&&tg.lockOrientation();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const devId=new URLSearchParams(location.search).get('dev')||'1'; // faqat DEV=1 serverda ishlaydi
const initData=tg?tg.initData:'';
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
async function api(p,m='GET',b){
 const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','x-init-data':initData,'x-dev-id':devId},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Xatolik');throw new Error(j.error||'err')}return j}
const socket=io({auth:{initData,devId}});
socket.on('connect_error',()=>toast('Serverga ulanib bo\'lmadi'));

/* ---------- Ma'lumotlar va ko'rinish ---------- */
let ME=null;
async function load(){ME=await api('/api/me');refresh()}
const rating=p=>Math.round((p.spd+p.sht+p.pas+p.def)/4);
function cardOf(id){const p=ME.players.find(x=>x.id==id);if(!p)return'';const r=rating(p),cl=r>=85?'x':r>=75?'g':r>=65?'s':'';
 return `<div class="card ${cl}"><div class="r">${r}<small>${p.pos}</small></div><div class="ph" style="background-image:url('${p.img}')"></div><div class="n">${p.name}</div><div class="st"><span>${p.spd}</span><span>${p.sht}</span><span>${p.pas}</span><span>${p.def}</span></div></div>`}
function refresh(){
 if(!ME)return;
 const g=ME.admin?'GP: cheksiz':'GP: '+ME.gp,c=ME.admin?'Coins: cheksiz':'Coins: '+ME.coins;
 document.querySelectorAll('.gpv').forEach(e=>e.textContent=g);document.querySelectorAll('.cov').forEach(e=>e.textContent=c);
 $('adminBtn').style.display=ME.admin?'block':'none';
 $('packs').innerHTML=ME.packs.map(k=>`<div class="pack"><div class="img" style="background-image:url('${k.img}')">${k.name}</div>
  <div class="buy"><button onclick="buyPack(${k.id},'gp')">${k.gp} GP</button><button class="ghost" onclick="buyPack(${k.id},'coins')">${k.coins} Coins</button></div>
  <div style="padding:0 12px 10px;color:var(--mute);font-size:13px">${k.cnt} ta o'yinchi</div></div>`).join('');
 $('owned').innerHTML=ME.owned.length?ME.owned.map(cardOf).join(''):'<p style="color:var(--mute)">Hali o\'yinchi yo\'q. Do\'kondan pack oching.</p>';
 if(ME.admin){
  $('kPool').innerHTML=ME.players.map(p=>`<label class="chk"><input type="checkbox" value="${p.id}">${p.name} (${p.pos}, ${rating(p)})</label>`).join('');
  $('gPl').innerHTML='<option value="">Tanlanmagan</option>'+ME.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  $('pList').innerHTML=ME.players.map(p=>`<div class="li"><span>${p.name} (${p.pos}, ${rating(p)})</span><button class="ghost" onclick="del('player',${p.id})">O'chirish</button></div>`).join('');
  $('kList').innerHTML=ME.packs.map(k=>`<div class="li"><span>${k.name} (${k.pool.length} o'yinchi)</span><button class="ghost" onclick="del('pack',${k.id})">O'chirish</button></div>`).join('');
 }
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');if(id!=='game'){cancelAnimationFrame(raf);G=null;try{if(tg){tg.exitFullscreen&&tg.exitFullscreen();tg.unlockOrientation&&tg.unlockOrientation()}}catch(e){}}if(id==='menu'||id==='shop'||id==='squad')load().catch(()=>{});else refresh()}

/* ---------- Do'kon ---------- */
async function buyPack(id,cur){const r=await api('/api/buy','POST',{packId:id,cur});await load();
 $('opened').innerHTML='<h2>Pack ochildi</h2><div class="cards">'+r.got.map(cardOf).join('')+'</div>'}

/* ---------- Admin ---------- */
const toUrl=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
async function upImg(f,ratio){
 if(!f)return '';
 if(ratio){const bm=await createImageBitmap(f);if(Math.abs(bm.width/bm.height-ratio)>.06){toast('Rasm 16:9 formatda bo\'lishi kerak');throw new Error('ratio')}}
 return (await api('/api/admin/upload','POST',{data:await toUrl(f)})).url}
async function addPlayer(){
 const img=await upImg($('pImg').files[0]);
 await api('/api/admin/player','POST',{name:$('pName').value,pos:$('pPos').value,spd:$('pSpd').value,sht:$('pSht').value,pas:$('pPas').value,def:$('pDef').value,img});
 $('pName').value='';toast('O\'yinchi qo\'shildi');load()}
async function addPack(){
 const img=await upImg($('kImg').files[0],16/9),pool=[...document.querySelectorAll('#kPool input:checked')].map(e=>+e.value);
 await api('/api/admin/pack','POST',{name:$('kName').value,img,gp:$('kGp').value,coins:$('kCo').value,cnt:$('kCnt').value,pool});
 toast('Pack yaratildi');load()}
async function del(t,id){if(!confirm('O\'chirilsinmi?'))return;await api('/api/admin/'+t+'/'+id,'DELETE');load()}
async function giveUser(){
 await api('/api/admin/give','POST',{uid:$('gUid').value,gp:$('gGp').value,coins:$('gCo').value,playerId:$('gPl').value});
 toast('Berildi');load()}

/* ---------- Lobbi ---------- */
let curCode='';
function showRoom(code,host){curCode=code;$('codeBox').textContent=code;$('room').style.display='block';
 $('startRoom').style.display=host?'block':'none';$('roomInfo').textContent=host?'Do\'st kodni kiritishini kuting.':'Xona egasi boshlashini kuting.'}
function createRoom(){socket.emit('lobby:create',r=>showRoom(r.code,true))}
function joinRoom(c){c=(c||'').trim().toUpperCase();if(c.length!==5){toast('Kod 5 belgidan iborat');return}
 socket.emit('lobby:join',c,r=>{if(r.error){toast(r.error);return}show('lobby');showRoom(r.code,false)})}
function leaveRoom(){socket.emit('game:leave');$('room').style.display='none';show('menu')}
socket.on('lobby:update',d=>{$('startRoom').disabled=!(d.host&&d.n===2);
 if(d.host)$('roomInfo').textContent=d.n===2?'Do\'st qo\'shildi. Boshlashingiz mumkin.':'Do\'st kodni kiritishini kuting.'});
function copyCode(){try{navigator.clipboard.writeText(curCode);toast('Kod nusxalandi')}catch(e){toast(curCode)}}
function shareCode(){const link=ME&&ME.bot?`https://t.me/${ME.bot}?startapp=${curCode}`:'';
 const u='https://t.me/share/url?url='+encodeURIComponent(link||'https://t.me')+'&text='+encodeURIComponent('Futbolda o\'ynaymiz! Xona kodi: '+curCode);
 tg?tg.openTelegramLink(u):window.open(u)}
socket.on('connect',()=>{const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;if(sp&&sp.length===5&&!G&&!curCode)joinRoom(sp)});

/* ---------- O'yin: 11 ga 11, serverdan kelgan holatni chizish ---------- */
const W=1280,H=720,M=70,GW=190,N=11,cv=$('cv'),ctx=cv.getContext('2d'),gm=$('game');
let raf=0,G=null,side=0,jx=0,jy=0,run=false,ROT=false,lastF=0;
// Rasmli o'yinchilar: public/sprites/ papkasiga qo'ying. Rasm bo'lmasa, kod o'zi odam chizadi.
const IMG={};['blue','red','gkb','gkr','ball'].forEach(n=>{const i=new Image();i.onload=()=>IMG[n]=i;i.src='/sprites/'+n+'.png'});
function fit(){
 ROT=innerHeight>innerWidth;gm.classList.toggle('rot',ROT); // tik turganda o'yinni 90° buraydi
 const cw=ROT?innerHeight:innerWidth,ch=ROT?innerWidth:innerHeight,r=window.devicePixelRatio||1,s=Math.min(cw/W,ch/H);
 if(ROT){gm.style.width=cw+'px';gm.style.height=ch+'px'}else{gm.style.width='';gm.style.height=''}
 cv.width=cw*r;cv.height=ch*r;
 if(G){G.s=s*r;G.ox=(cw*r-W*s*r)/2;G.oy=(ch*r-H*s*r)/2}}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
socket.on('game:start',d=>{side=d.side;G={cur:null,tg:null,an:[],s:1,ox:0,oy:0};jx=jy=0;run=false;
 try{if(tg){tg.requestFullscreen&&tg.requestFullscreen();tg.lockOrientation&&tg.lockOrientation()}}catch(e){}
 show('game');$('over').style.display='none';fit();setTimeout(fit,400);cancelAnimationFrame(raf);lastF=performance.now();loop()});
socket.on('st',s=>{if(!G)return;G.tg=s;if(!G.cur){G.cur=JSON.parse(JSON.stringify(s));G.an=s.p.map(()=>({face:1,ph:Math.random()*6,spd:0}))}});
socket.on('end',d=>{if(!G)return;const my=d.sc[side],op=d.sc[1-side];
 $('ovT').textContent=d.reason==='left'?'Raqib chiqib ketdi':my>op?'Siz yutdingiz':my===op?'Durang':'Siz yutqazdingiz';
 $('ovS').textContent=`${my} : ${op}`+(d.reward?`   +${d.reward} GP`:'');$('over').style.display='flex'});
function exitGame(){socket.emit('game:leave');show('menu')}
const sendIn=()=>socket.emit('in',{jx:side?-jx:jx,jy,run}); // 2-jamoa uchun maydon aylantirilgan
function loop(now=performance.now()){
 raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastF)/1000)||.016;lastF=now;
 if(!G||!G.cur)return;const c=G.cur,t=G.tg;
 for(let i=0;i<c.p.length;i++){const a=G.an[i],ox=c.p[i][0];
  c.p[i][0]+=(t.p[i][0]-c.p[i][0])*.5;c.p[i][1]+=(t.p[i][1]-c.p[i][1])*.5;
  const dx=(c.p[i][0]-ox)*(side?-1:1);a.spd+=((Math.abs(c.p[i][0]-ox)*60)-a.spd)*.25;
  if(Math.abs(dx)>.25)a.face=dx>0?1:-1;a.ph+=a.spd*dt*.05}
 c.b[0]+=(t.b[0]-c.b[0])*.5;c.b[1]+=(t.b[1]-c.b[1])*.5;c.sc=t.sc;c.t=t.t;c.st=t.st;c.c=t.c;draw(c)}
// Procedural odam (rasm bo'lmaganda): oyoq, tana, qo'l, bosh
function human(c,kit,a,bob){
 const sw=a.spd>25?Math.sin(a.ph):0,skin='#f1c27d';c.lineCap='round';
 c.strokeStyle=skin;c.lineWidth=8;
 c.beginPath();c.moveTo(-4,-34-bob);c.lineTo(-4+sw*16,-5);c.stroke();
 c.beginPath();c.moveTo(5,-34-bob);c.lineTo(5-sw*16,-5);c.stroke();
 c.fillStyle='#fff';c.fillRect(-11,-38-bob,22,12);
 c.fillStyle='#111';c.beginPath();c.ellipse(-4+sw*16+2,-3,7,4,0,0,7);c.fill();c.beginPath();c.ellipse(5-sw*16+2,-3,7,4,0,0,7);c.fill();
 c.strokeStyle=skin;c.lineWidth=7;c.beginPath();c.moveTo(-9,-62-bob);c.lineTo(-9-sw*12,-42-bob);c.stroke();
 c.fillStyle=kit;c.fillRect(-12,-68-bob,24,34);
 c.strokeStyle=skin;c.beginPath();c.moveTo(9,-62-bob);c.lineTo(9+sw*12,-42-bob);c.stroke();
 c.fillStyle=skin;c.beginPath();c.arc(2,-78-bob,10,0,7);c.fill();
 c.fillStyle='#2b1d12';c.beginPath();c.arc(1,-80-bob,10,Math.PI*1.05,Math.PI*1.95);c.fill()}
function drawPlayer(c,x,y,a,team,gk,ctl,num){
 c.fillStyle='#0005';c.beginPath();c.ellipse(x,y+12,24,9,0,0,7);c.fill();
 if(ctl){c.strokeStyle='#ffd23f';c.lineWidth=5;c.beginPath();c.ellipse(x,y+12,32,13,0,0,7);c.stroke()}
 const k=IMG[gk?(team?'gkr':'gkb'):(team?'red':'blue')]||IMG[team?'red':'blue'];
 const mv=a.spd>25,bob=mv?Math.abs(Math.sin(a.ph))*7:0,lean=mv?Math.min(.18,a.spd/1600):0;
 c.save();c.translate(x,y+12);c.scale(a.face,1);c.rotate(lean);
 if(k){const h=92,w=h*k.width/k.height;c.drawImage(k,-w/2,-h-bob,w,h)}
 else human(c,gk?'#f5c542':team?'#e63946':'#2d7ff9',a,bob);
 c.restore();
 if(ctl){c.fillStyle='#ffd23f';c.beginPath();c.moveTo(x,y-96);c.lineTo(x-9,y-110);c.lineTo(x+9,y-110);c.fill();
  c.fillStyle='#fff';c.font='bold 16px system-ui';c.textAlign='center';c.fillText(num,x,y-116)}}
function draw(s){
 const c=ctx,X=x=>side?W-x:x;c.setTransform(1,0,0,1,0,0);c.fillStyle='#07121f';c.fillRect(0,0,cv.width,cv.height);
 c.setTransform(G.s,0,0,G.s,G.ox,G.oy);
 for(let i=0;i<16;i++){c.fillStyle=i%2?'#1c7544':'#208149';c.fillRect(i*W/16,0,W/16+1,H)}
 c.strokeStyle='#ffffffd0';c.lineWidth=4;c.strokeRect(M,M,W-2*M,H-2*M);
 c.beginPath();c.moveTo(W/2,M);c.lineTo(W/2,H-M);c.stroke();c.beginPath();c.arc(W/2,H/2,85,0,7);c.stroke();
 c.strokeRect(M,H/2-200,190,400);c.strokeRect(W-M-190,H/2-200,190,400);c.strokeRect(M,H/2-95,70,190);c.strokeRect(W-M-70,H/2-95,70,190);
 c.fillStyle='#ffffff40';c.fillRect(M-30,H/2-GW/2,30,GW);c.fillRect(W-M,H/2-GW/2,30,GW);
 // o'yinchilar y bo'yicha tartiblanib chiziladi (chuqurlik)
 const ord=s.p.map((p,i)=>i).sort((a,b)=>s.p[a][1]-s.p[b][1]),bt=s.b;
 let ballDone=false;const bdraw=()=>{ballDone=true;const bx=X(bt[0]),by=bt[1];
  c.fillStyle='#0006';c.beginPath();c.ellipse(bx,by+8,12,5,0,0,7);c.fill();
  if(IMG.ball)c.drawImage(IMG.ball,bx-14,by-14,28,28);else{c.fillStyle='#fff';c.beginPath();c.arc(bx,by,11,0,7);c.fill();c.strokeStyle='#222';c.lineWidth=2;c.stroke();c.fillStyle='#222';c.beginPath();c.arc(bx,by,4,0,7);c.fill()}};
 for(const i of ord){if(!ballDone&&bt[1]<s.p[i][1])bdraw();
  const tm=i<N?0:1,li=i%N,mine=tm===side,ctl=mine&&s.c[side]===li;
  drawPlayer(c,X(s.p[i][0]),s.p[i][1],G.an[i],mine?0:1,li===0,ctl,li+1)}
 if(!ballDone)bdraw();
 c.fillStyle='#ffffff44';c.fillRect(W/2-60,H-34,120,8);c.fillStyle='#ffd23f';c.fillRect(W/2-60,H-34,120*s.st[side]/100,8);
 const t=Math.max(0,s.t);$('hud').textContent=`${s.sc[side]}  :  ${s.sc[1-side]}     ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}

/* Joystik va tugmalar (tik turganda burilgan holat uchun koordinatalar o'giriladi) */
const st=$('stick'),base=$('base'),knob=$('knob');let sid=null,ox=0,oy=0;
const toLocal=e=>{const r=st.getBoundingClientRect();return ROT?{x:e.clientY-r.top,y:r.right-e.clientX}:{x:e.clientX-r.left,y:e.clientY-r.top}};
st.addEventListener('pointerdown',e=>{if(sid!==null)return;sid=e.pointerId;st.setPointerCapture(sid);const q=toLocal(e);ox=q.x;oy=q.y;
 base.style.display=knob.style.display='block';base.style.left=ox-70+'px';base.style.top=oy-70+'px';knob.style.left=ox-30+'px';knob.style.top=oy-30+'px'});
st.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;const q=toLocal(e);let dx=q.x-ox,dy=q.y-oy;
 const l=Math.hypot(dx,dy),mx=60;if(l>mx){dx=dx/l*mx;dy=dy/l*mx}knob.style.left=ox+dx-30+'px';knob.style.top=oy+dy-30+'px';
 jx=dx/mx;jy=dy/mx;sendIn()});
const rel=e=>{if(e.pointerId!==sid)return;sid=null;jx=jy=0;base.style.display=knob.style.display='none';sendIn()};
st.addEventListener('pointerup',rel);st.addEventListener('pointercancel',rel);
const hold=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();f()});
hold('bS',()=>socket.emit('act',{k:'S'}));hold('bP',()=>socket.emit('act',{k:'P'}));hold('bT',()=>socket.emit('act',{k:'T'}));
$('bR').addEventListener('pointerdown',e=>{e.preventDefault();run=true;sendIn()});
['pointerup','pointercancel','pointerleave'].forEach(t=>$('bR').addEventListener(t,()=>{if(run){run=false;sendIn()}}));

load().catch(()=>{});
